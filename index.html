<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BitPoin (BTP) — عملة رقمية مجتمعية</title>
    <meta name="description" content="BitPoin (BTP): راتب يومي، ألعاب، بنك بفائدة، متجر وقروض وإحالات — موقع وبوت تلجرام بحساب واحد." />
    <meta name="theme-color" content="#05070d" />
    <link rel="canonical" href="./docs/" />
    <link rel="icon" href="docs/favicon.svg" type="image/svg+xml" />
    <script>
      // توجيه فوري إلى التطبيق
      location.replace("./docs/" + (location.hash || "#/"));
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=./docs/" /></noscript>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; }
      body {
        display: grid; place-items: center; color: #e8eefc;
        font-family: "Cairo", "Segoe UI", Tahoma, system-ui, sans-serif; text-align: center;
      }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; display: grid; place-items: center;
        background: conic-gradient(from 210deg at 50% 50%, #f5b301, #ffe08a, #d99a00, #fff3c4, #f5b301);
        color: #0b0f1a; font-weight: 900; font-size: 20px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #94a3b8; font-size: 13px; margin: 0; }
      a { color: #3ee3ad; }
      .bar {
        width: 180px; height: 4px; margin: 18px auto 0; border-radius: 99px;
        background: rgba(255, 255, 255, 0.1); overflow: hidden;
      }
      .bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: #3ee3ad; animation: slide 1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">BTP</div>
      <h1>جارٍ فتح BitPoin…</h1>
      <p>إن لم يفتح تلقائياً، <a href="./docs/">اضغط هنا</a>.</p>
      <div class="bar"><i></i></div>
    </div>
  </body>
</html>
